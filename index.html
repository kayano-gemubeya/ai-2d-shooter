<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI ARENA</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<div id="gameWrap">

  <canvas id="game"></canvas>


  <!-- =========================
       START SCREEN
  ========================== -->

  <div id="startScreen">

    <div id="startPanel">

      <h1>AI ARENA</h1>

      <p class="subtitle">
        2D 1 VS 1 SHOOTER
      </p>


      <h2>SELECT LEVEL</h2>


      <div id="levelSelect">

        <button
          class="levelButton selected"
          data-level="1"
          type="button"
        >
          LEVEL 1
        </button>


        <button
          class="levelButton"
          data-level="2"
          type="button"
        >
          LEVEL 2
        </button>


        <button
          class="levelButton"
          data-level="3"
          type="button"
        >
          LEVEL 3
        </button>


        <button
          class="levelButton"
          data-level="4"
          type="button"
        >
          LEVEL 4
        </button>


        <button
          class="levelButton"
          data-level="5"
          type="button"
        >
          LEVEL 5
        </button>

      </div>


      <div id="selectedLevel">
        Selected: LEVEL 1
      </div>


      <button
        id="startBtn"
        type="button"
      >
        START
      </button>


      <div id="controlsText">

        <p>PC</p>

        <p>
          A / D または ← / →：移動
        </p>

        <p>
          W / ↑ / Space：ジャンプ
        </p>

        <p>
          F / クリック：射撃
        </p>

        <p>
          スマホ：画面下のボタン
        </p>

      </div>

    </div>

  </div>


  <!-- =========================
       HUD
  ========================== -->

  <div
    id="hud"
    class="hidden"
  >

    <div class="hpArea">

      <div class="hpName">
        YOU
      </div>

      <div class="hpBar">
        <div id="playerHp"></div>
      </div>

      <div id="playerHpText">
        10 / 10
      </div>

    </div>


    <div id="levelText">
      LEVEL 1
    </div>


    <div class="hpArea cpuHp">

      <div class="hpName">
        CPU
      </div>

      <div class="hpBar">
        <div id="enemyHp"></div>
      </div>

      <div id="enemyHpText">
        10 / 10
      </div>

    </div>

  </div>


  <!-- =========================
       RESULT
  ========================== -->

  <div
    id="resultScreen"
    class="hidden"
  >

    <div id="resultPanel">

      <h1 id="resultTitle">
        YOU WIN!
      </h1>

      <p id="resultText"></p>


      <button
        id="nextLevelBtn"
        type="button"
      >
        NEXT LEVEL
      </button>


      <button
        id="restartBtn"
        type="button"
      >
        REMATCH
      </button>


      <button
        id="menuBtn"
        type="button"
      >
        LEVEL SELECT
      </button>

    </div>

  </div>


  <!-- =========================
       TOUCH CONTROLS
  ========================== -->

  <div id="touchControls">

    <div>

      <button data-key="left">
        ◀
      </button>

      <button data-key="right">
        ▶
      </button>

    </div>


    <div>

      <button data-key="jump">
        ▲
      </button>

      <button data-key="shoot">
        ●
      </button>

    </div>

  </div>


</div>


<script src="game.js?v=5"></script>

</body>

</html>
