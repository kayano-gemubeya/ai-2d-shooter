<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>AI Arena - 2D Shooter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gameWrap">
    <canvas id="game" aria-label="2D AI shooter game"></canvas>

    <section id="startScreen" class="overlay">
      <div class="panel">
        <h1>AI ARENA</h1>
        <p>1 vs 1 2D SHOOTER</p>
        <button id="startBtn">START</button>
        <div class="help">
          <span>PC: A/D or ←/→ = 移動</span>
          <span>W / ↑ / Space = ジャンプ</span>
          <span>クリック / F = 射撃</span>
          <span>スマホ: 画面下のボタンで操作</span>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="overlay hidden">
      <div class="panel">
        <h2 id="resultTitle">YOU WIN!</h2>
        <p id="resultText"></p>
        <button id="restartBtn">REMATCH</button>
      </div>
    </section>

    <div id="touchControls" aria-hidden="true">
      <div class="touchLeft">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="touchRight">
        <button data-key="jump">▲</button>
        <button data-key="shoot">●</button>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="hpBox"><b>YOU</b><div class="bar"><i id="playerHp"></i></div><span id="playerHpText">10 / 10</span></div>
      <div class="status">BEST OF 1</div>
      <div class="hpBox enemy"><b>AI</b><div class="bar"><i id="enemyHp"></i></div><span id="enemyHpText">10 / 10</span></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
