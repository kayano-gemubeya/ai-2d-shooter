<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AI ARENA - 2D Shooter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="gameWrap">

  <canvas id="game"></canvas>


  <!-- =========================
       スタート画面
  ========================== -->

  <section id="startScreen" class="overlay">

    <div class="panel">

      <h1>AI ARENA</h1>

      <p>1 VS 1 2D SHOOTER</p>


      <h3>SELECT LEVEL</h3>

      <div id="levelSelect">

        <button class="levelButton selected" data-level="1">
          LEVEL 1
        </button>

        <button class="levelButton" data-level="2">
          LEVEL 2
        </button>

        <button class="levelButton" data-level="3">
          LEVEL 3
        </button>

        <button class="levelButton" data-level="4">
          LEVEL 4
        </button>

        <button class="levelButton" data-level="5">
          LEVEL 5
        </button>

      </div>


      <button id="startBtn">
        START
      </button>


      <div class="help">

        <span>PC：A / D または ← / → = 移動</span>

        <span>W / ↑ / Space = ジャンプ</span>

        <span>F / クリック = 射撃</span>

        <span>スマホ：画面下のボタン</span>

      </div>

    </div>

  </section>


  <!-- =========================
       勝敗画面
  ========================== -->

  <section id="resultScreen" class="overlay hidden">

    <div class="panel">

      <h2 id="resultTitle">
        YOU WIN!
      </h2>

      <p id="resultText"></p>

      <button id="nextLevelBtn">
        NEXT LEVEL
      </button>

      <button id="restartBtn">
        REMATCH
      </button>

    </div>

  </section>


  <!-- =========================
       HUD
  ========================== -->

  <div id="hud" class="hidden">

    <div class="hpBox">

      <b>YOU</b>

      <div class="bar">
        <i id="playerHp"></i>
      </div>

      <span id="playerHpText">
        10 / 10
      </span>

    </div>


    <div class="status">

      <span id="levelText">
        LEVEL 1
      </span>

    </div>


    <div class="hpBox enemy">

      <b>CPU</b>

      <div class="bar">
        <i id="enemyHp"></i>
      </div>

      <span id="enemyHpText">
        10 / 10
      </span>

    </div>

  </div>


  <!-- =========================
       スマホ操作
  ========================== -->

  <div id="touchControls">

    <div class="touchLeft">

      <button data-key="left">
        ◀
      </button>

      <button data-key="right">
        ▶
      </button>

    </div>


    <div class="touchRight">

      <button data-key="jump">
        ▲
      </button>

      <button data-key="shoot">
        ●
      </button>

    </div>

  </div>

</main>


<!-- ★ キャッシュ対策で ?v=2 を付けています -->
<script src="game.js?v=2"></script>

</body>
</html>
